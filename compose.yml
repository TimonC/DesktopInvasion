services:
  invasionview:
    build: .
    container_name: invasionview
    user: "${UID}:${GID}"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_QPA_EGLFS_FORCE_SOFTWARE=1
      - XDG_RUNTIME_DIR=/tmp/xdg
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/app/src
      - ./sprites:/app/sprites  # For new QML files
      - ./assets:/app/assets
    stdin_open: true
    tty: true

