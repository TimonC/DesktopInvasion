services:
  invasionview:
    build: .
    container_name: invasionview
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - XDG_RUNTIME_DIR=/tmp/xdg
      - TZ=Europe/Berlin
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/app/src
      - ./sprites:/app/sprites
      - ./assets:/app/assets
      - /dev/dri:/dev/dri   # <-- forward GPU device
    stdin_open: true
    tty: true

