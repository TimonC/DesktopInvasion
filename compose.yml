services:
  dev:
    build: .
    container_name: desktopinvasion-dev
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - XDG_RUNTIME_DIR=/tmp/xdg
      - TZ=Europe/Berlin
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/app/src
      - ./include:/app/include
      - ./qml:/app/qml
      - game_state:/app/data
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    entrypoint: ["./build_dev.sh"]

  prod:
    build: .
    container_name: desktopinvasion-prod
    entrypoint: ["./build_prod.sh"]
    volumes:
      - ./app/output:/app/output

volumes:
  game_state:
