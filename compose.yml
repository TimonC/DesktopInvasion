services:
  invasionview:
    build: .
    container_name: invasionview
    environment:
      - QT_QPA_PLATFORM=xcb
      - DISPLAY=${DISPLAY}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_QPA_EGLFS_FORCE_SOFTWARE=1
      - XDG_RUNTIME_DIR=/tmp/xdg
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/xdg:/tmp/xdg
      - ./src:/app/src
    stdin_open: true
    tty: true
    command: /app/build_and_run.sh

