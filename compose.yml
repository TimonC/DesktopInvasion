services:
  dev:
    build: .
    container_name: desktopinvasion-dev
    stop_grace_period: 3s
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      - XDG_RUNTIME_DIR=/tmp/xdg
      - TZ=Europe/Berlin
      - DOCKER_ENV=dev
      - VALGRIND_MODE=0
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./src:/app/src
      - ./include:/app/include
      - ./qml:/app/qml
      - game_state:/app/data
      - /dev/dri:/dev/dri
      - ./valgrind_logs:/app/logs
    stdin_open: true
    tty: true
    entrypoint: ["./build_dev.sh"]

  build-linux:
    build: .
    container_name: desktopinvasion-build-linux
    entrypoint: ["./build_linux.sh"]
    environment:
      - DOCKER_ENV=prod
      - VALGRIND_MODE=0
    volumes:
      - ./app/output:/app/output

  build-windows:
    build:
      context: .
      dockerfile: Dockerfile-win
    container_name: desktopinvasion-build-windows
    entrypoint: ["./build_windows.sh"]
    environment:
      - DOCKER_ENV=prod
      - VALGRIND_MODE=0
    volumes:
      - ./app/output:/app/output

volumes:
  game_state:
