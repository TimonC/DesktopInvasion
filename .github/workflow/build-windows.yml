name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          cache: true

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          mkdir output\DesktopInvasion-Windows
          copy build\DesktopInvasion.exe output\DesktopInvasion-Windows\
          windeployqt.exe --release --qmldir qml output\DesktopInvasion-Windows\DesktopInvasion.exe

          # Copy MinGW DLLs
          $mingwBin = "${{ env.Qt6_Dir }}\..\..\..\Tools\mingw1310_64\bin"
          copy "$mingwBin\libstdc++-6.dll" output\DesktopInvasion-Windows\
          copy "$mingwBin\libgcc_s_seh-1.dll" output\DesktopInvasion-Windows\
          copy "$mingwBin\libwinpthread-1.dll" output\DesktopInvasion-Windows\

          # Create README
          echo "Desktop Invasion - Windows Version" > output\DesktopInvasion-Windows\README.txt
          echo "To play: Double-click DesktopInvasion.exe" >> output\DesktopInvasion-Windows\README.txt

          # Zip it
          Compress-Archive -Path output\DesktopInvasion-Windows -DestinationPath DesktopInvasion-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopInvasion-Windows
          path: DesktopInvasion-Windows.zip
