name: Build Windows (MSVC)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      OUT_DIR: output\DesktopInvasion-Windows
    steps:
    - uses: actions/checkout@v4

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    - run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Recurse build | Where-Object { $_.Name -eq "DesktopInvasion.exe" } | Select-Object -First 1
        if (-not $exePath) {
          Write-Error "Could not find DesktopInvasion.exe"
          Get-ChildItem -Recurse build
          exit 1
        }
        New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
        Copy-Item $exePath.FullName $env:OUT_DIR\
        $qmlDir = "$pwd\qml"
        if (Test-Path $qmlDir) {
          windeployqt6 --verbose 0 --release --compiler-runtime --no-translations --qmldir $qmlDir "$env:OUT_DIR\DesktopInvasion.exe"
        } else {
          Write-Warning "QML directory not found at $qmlDir, deploying without QML"
          windeployqt6 --verbose 0 --release --compiler-runtime --no-translations "$env:OUT_DIR\DesktopInvasion.exe"
        }
        if ($LASTEXITCODE -ne 0) {
          Write-Error "windeployqt6 failed with exit code $LASTEXITCODE"
          exit 1
        }
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        if ($vsPath) {
          $vcRedist = "$vsPath\VC\Redist\MSVC\v143\Microsoft.VC143.CRT"
          if (Test-Path $vcRedist) {
            Copy-Item "$vcRedist\*.dll" $env:OUT_DIR\ -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Debug package contents
      shell: pwsh
      run: |
        if (-not (Test-Path $env:OUT_DIR)) {
          Write-Error "Package directory does not exist: $env:OUT_DIR"
          exit 1
        }
        $files = Get-ChildItem -Recurse $env:OUT_DIR
        if ($files.Count -eq 0) {
          Write-Error "Package directory is empty"
          exit 1
        }
        $missingFiles = @()
        if (-not ($files | Where-Object { $_.Name -eq "DesktopInvasion.exe" })) {
          $missingFiles += "DesktopInvasion.exe"
        }
        if (-not ($files | Where-Object { $_.Name -like "Qt6*.dll" })) {
          $missingFiles += "Qt6*.dll"
        }
        if ($missingFiles.Count -gt 0) {
          Write-Error "Missing required files: $($missingFiles -join ', ')"
          Get-ChildItem -Recurse $env:OUT_DIR | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }

    - name: Smoke test
      shell: pwsh
      timeout-minutes: 1
      run: |
        $exePath = "$env:OUT_DIR\DesktopInvasion.exe"
        if (-not (Test-Path $exePath)) {
          Write-Error "Executable not found: $exePath"
          exit 1
        }
        $out = "smoke_stdout.log"
        $err = "smoke_stderr.log"
        $timeoutSeconds = 10
        try {
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo.FileName = $exePath
          $proc.StartInfo.UseShellExecute = $false
          $proc.StartInfo.RedirectStandardOutput = $true
          $proc.StartInfo.RedirectStandardError = $true
          $proc.StartInfo.CreateNoWindow = $true
          $proc.Start() | Out-Null
          $output = $proc.StandardOutput.ReadToEnd()
          $errorOutput = $proc.StandardError.ReadToEnd()
          if ($proc.WaitForExit($timeoutSeconds * 1000)) {
            $exitCode = $proc.ExitCode
            if ($output) { $output | Out-File $out -Encoding utf8 }
            if ($errorOutput) { $errorOutput | Out-File $err -Encoding utf8 }
            if ($exitCode -ne 0) {
              Write-Error "Process exited with code $exitCode"
              if ($output) { Write-Host "STDOUT:"; Write-Host $output }
              if ($errorOutput) { Write-Host "STDERR:"; Write-Host $errorOutput }
              exit 1
            }
          } else {
            $proc.Kill()
            $proc.WaitForExit()
            Write-Error "Process timed out after ${timeoutSeconds} seconds"
            if ($output) { $output | Out-File $out -Encoding utf8 }
            if ($errorOutput) { $errorOutput | Out-File $err -Encoding utf8 }
            exit 1
          }
        }
        catch {
          $errMsg = "Exception: $_"
          Write-Error $errMsg
          $errMsg | Out-File smoke.log
          exit 1
        }
        if (Test-Path $out) { Get-Content $out | Out-File smoke.log -Append }
        if (Test-Path $err) { Get-Content $err | Out-File smoke.log -Append }
        if (-not (Test-Path smoke.log)) { "No output captured" | Out-File smoke.log }

    - name: Upload smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-log-windows
        path: smoke.log

    - uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: output/DesktopInvasion-Windows/
