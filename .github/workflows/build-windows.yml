name: Build Windows (MinGW)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MinGW
      id: mingw-cache
      uses: actions/cache@v4
      with:
        path: C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64
        key: ${{ runner.os }}-mingw-13.2.0

    - name: Setup MinGW
      if: steps.mingw-cache.outputs.cache-hit != 'true'
      run: |
        choco install mingw --version=13.2.0 --allow-downgrade -y --force
      shell: powershell

    - name: Add MinGW to PATH
      run: |
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
        New-Item -ItemType Directory -Force -Path "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\lib" -ErrorAction SilentlyContinue
      shell: powershell

    - name: Verify MinGW
      run: |
        gcc --version
        g++ --version
      shell: bash

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Configure CMake
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path output/DesktopInvasion-Windows
        $exePath = "build/bin/DesktopInvasion.exe"
        if (Test-Path $exePath) {
          Copy-Item $exePath output/DesktopInvasion-Windows/
          Write-Host "Copied executable from $exePath"
        } else {
          Write-Host "Executable not found at $exePath"
          Get-ChildItem -Path build -Recurse
          exit 1
        }
        windeployqt.exe --release --qmldir qml output/DesktopInvasion-Windows/DesktopInvasion.exe
        $dlls = @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")
        foreach ($dll in $dlls) {
          $dllPath = & g++ -print-file-name=$dll 2>$null
          if (Test-Path $dllPath) {
            Copy-Item $dllPath output/DesktopInvasion-Windows/
            Write-Host "Copied $dll"
          } else {
            Write-Host "Warning: $dll not found"
          }
        }
        Compress-Archive -Path output\DesktopInvasion-Windows -DestinationPath DesktopInvasion-Windows.zip -Force
        Write-Host "Package created: DesktopInvasion-Windows.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: DesktopInvasion-Windows.zip
