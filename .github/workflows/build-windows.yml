name: Build Windows (MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      OUT_DIR: output\DesktopInvasion-Windows

    steps:
    - uses: actions/checkout@v4

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    - name: Configure
      shell: bash
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: cmake --build build --config Release --parallel

    - name: Package
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Recurse build | Where-Object { $_.Name -eq "DesktopInvasion.exe" } | Select-Object -First 1
        if (-not $exePath) { exit 1 }

        New-Item -ItemType Directory -Force -Path $env:OUT_DIR | Out-Null
        Copy-Item $exePath.FullName $env:OUT_DIR\

        $qmlDir = "$pwd\qml"

        if (Test-Path $qmlDir) {
          windeployqt6 --release --compiler-runtime --no-translations --qmldir $qmlDir "$env:OUT_DIR\DesktopInvasion.exe"
        } else {
          windeployqt6 --release --compiler-runtime --no-translations "$env:OUT_DIR\DesktopInvasion.exe"
        }

        $qtPath = $env:Qt6_DIR
        $sqlSrc = Get-ChildItem -Recurse "$qtPath" -Filter qsqlite.dll | Select-Object -First 1

        if ($sqlSrc) {
          $destDir = "$env:OUT_DIR\sqldrivers"
          $destFile = Join-Path $destDir "qsqlite.dll"

          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          if (-not (Test-Path $destFile)) {
            Copy-Item $sqlSrc.FullName $destFile -Force
          }
        }
    - name: Verify
      shell: pwsh
      run: |
        Get-ChildItem -Recurse $env:OUT_DIR

    - name: Smoke test
      shell: pwsh
      timeout-minutes: 1
      run: |
        $env:QT_QPA_PLATFORM="offscreen"
        $env:QT_DEBUG_PLUGINS="1"

        $exePath = "$env:OUT_DIR\DesktopInvasion.exe"

        $outFile = "smoke_stdout.log"
        $errFile = "smoke_stderr.log"

        $proc = Start-Process -FilePath $exePath `
          -ArgumentList "--smoke-test" `
          -PassThru `
          -NoNewWindow `
          -RedirectStandardOutput $outFile `
          -RedirectStandardError $errFile

        Start-Sleep -Seconds 10

        if (!$proc.HasExited) {
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
        }

        $stdout = if (Test-Path $outFile) { Get-Content $outFile } else { @() }
        $stderr = if (Test-Path $errFile) { Get-Content $errFile } else { @() }

        $log = @()
        if ($stdout.Count -gt 0) { $log += "--- STDOUT ---"; $log += $stdout }
        if ($stderr.Count -gt 0) { $log += "--- STDERR ---"; $log += $stderr }
        if ($log.Count -eq 0) { $log = "NO OUTPUT" }

        $log | Out-File -FilePath smoke.log -Encoding utf8

    - name: Upload smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-log-windows
        path: smoke.log

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: output/DesktopInvasion-Windows/
