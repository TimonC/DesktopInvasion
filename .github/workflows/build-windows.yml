- name: Install Qt (MSVC)
  uses: jurplel/install-qt-action@v3
  with:
    version: '6.8.0'
    host: 'windows'
    target: 'desktop'
    arch: 'win64_msvc2022_64'
    cache: true
    add-tools-to-path: true

- name: Configure CMake
  run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
  shell: bash

- name: Build
  run: cmake --build build --config Release --parallel
  shell: bash

- name: Package
  shell: powershell
  run: |
    $outputDir = "output/DesktopInvasion-Windows"
    New-Item -ItemType Directory -Force -Path $outputDir

    $exePath = Get-ChildItem -Path build -Recurse -Filter "DesktopInvasion.exe" |
               Where-Object { $_.FullName -match "Release" } |
               Select-Object -First 1 -ExpandProperty FullName
    if (-not $exePath) {
      Write-Error "Executable not found!"
      exit 1
    }
    Write-Host "Found exe: $exePath"
    Copy-Item $exePath $outputDir/

    $qtBinDir = "$env:Qt6_DIR/../../bin"
    $windeployqt = (Resolve-Path "$qtBinDir/windeployqt6.exe").Path
    Write-Host "Using windeployqt6: $windeployqt"

    & $windeployqt `
      --release `
      --compiler-runtime `
      --no-translations `
      --verbose 2 `
      --qmldir "$pwd\qml" `
      "$outputDir\DesktopInvasion.exe"

    $vcRedistDir = "${env:VCToolsRedistDir}x64\Microsoft.VC143.CRT"
    if (Test-Path $vcRedistDir) {
      Write-Host "Copying MSVC runtime from: $vcRedistDir"
      Get-ChildItem "$vcRedistDir\*.dll" | ForEach-Object {
        Copy-Item $_.FullName $outputDir/ -Force
        Write-Host "  Copied: $($_.Name)"
      }
    } else {
      Write-Warning "VCToolsRedistDir not found: $vcRedistDir"
    }

    Write-Host "Final contents:"
    Get-ChildItem $outputDir | Select-Object Name

    Compress-Archive -Path "$outputDir\*" -DestinationPath DesktopInvasion-Windows.zip -Force
