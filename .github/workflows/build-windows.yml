name: Build Windows (MSVC)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      OUT_DIR: output\DesktopInvasion-Windows
      EXE_PATH: build\bin\Release\DesktopInvasion.exe
    steps:
    - uses: actions/checkout@v4

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        cache: true

    - run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path $env:OUT_DIR
        Copy-Item $env:EXE_PATH $env:OUT_DIR\
        windeployqt6 --release --compiler-runtime --no-translations --qmldir "$pwd\qml" "$env:OUT_DIR\DesktopInvasion.exe"
        $vcRedist = "${env:VCToolsRedistDir}x64\Microsoft.VC143.CRT"
        if (Test-Path $vcRedist) {
          Copy-Item "$vcRedist\*.dll" $env:OUT_DIR\ -Force
        }

    - name: Smoke test
      shell: pwsh
      timeout-minutes: 1
      run: |
        $log = "smoke.log"
        $proc = Start-Process -FilePath "$env:OUT_DIR\DesktopInvasion.exe" `
          -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $log
        Start-Sleep -Seconds 5
        if ($proc.HasExited -and $proc.ExitCode -ne 0) {
          Get-Content $log -ErrorAction SilentlyContinue
          Write-Error "App crashed. Exit code: $($proc.ExitCode)"; exit 1
        }
        if (-not $proc.HasExited) { $proc.Kill() }

    - name: Upload smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-log
        path: smoke.log

    - uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: output/DesktopInvasion-Windows/
