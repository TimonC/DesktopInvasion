name: Build Windows (MSVC)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (MSVC)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        $outputDir = "output\DesktopInvasion-Windows"
        New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

        $exePath = Get-ChildItem -Path build -Recurse -Filter "DesktopInvasion.exe" |
                   Where-Object { $_.FullName -match "Release" } |
                   Select-Object -First 1 -ExpandProperty FullName

        if (-not $exePath) {
          $exePath = Get-ChildItem -Path build -Recurse -Filter "DesktopInvasion.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not $exePath) {
          Write-Error "Executable not found!"
          Get-ChildItem -Path build -Recurse -Filter "*.exe"
          exit 1
        }

        Write-Host "Found exe: $exePath"
        Copy-Item $exePath "$outputDir\"

        windeployqt6 --release --compiler-runtime --no-translations --verbose 2 --qmldir "$pwd\qml" "$outputDir\DesktopInvasion.exe"

        $vcRedistDir = "${env:VCToolsRedistDir}x64\Microsoft.VC143.CRT"
        if (Test-Path $vcRedistDir) {
          Get-ChildItem "$vcRedistDir\*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$outputDir\" -Force
          }
        }

        # Create README.txt – plain text, no HTML, no heredoc
        $readmeLines = @(
          "After unzipping the file, run DesktopInvasion.exe to start the game.",
          "",
          "If automatic startup on pc boot isn't working, you might have to unzip",
          "DesktopInvasion (or move all its contents) to the folder:",
          "C:/Users/<USERNAME>/AppData/Local/DesktopInvasion",
          "",
          "Requires a modern x64-bit Visual C++ Redistributable.",
          "You likely already have this installed. If not, download it from:",
          "https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist?view=msvc-170#latest-supported-redistributable-version",
          "",
          "This desktop pet game is a fan creation without any official release,",
          "so you will have to authorize the app upon running it the first time."
        )
        $readmePath = Join-Path $outputDir "README.txt"
        Set-Content -Path $readmePath -Value $readmeLines -Encoding UTF8
        Write-Host "Created $readmePath"

        Get-ChildItem $outputDir | Select-Object Name, Length

    - name: Smoke test
      shell: powershell
      timeout-minutes: 1
      run: |
        $exe = "output\DesktopInvasion-Windows\DesktopInvasion.exe"

        if (-not (Test-Path $exe)) {
          Write-Error "Exe not found for smoke test: $exe"
          exit 1
        }

        $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden

        Start-Sleep -Seconds 5

        if ($proc.HasExited) {
          $code = $proc.ExitCode
          if ($code -ne 0) {
            Write-Error "App crashed on startup. Exit code: $code"
            exit 1
          } else {
            Write-Host "App exited with code 0 within 5 seconds"
          }
        } else {
          Write-Host "Smoke test passed"
          $proc.Kill()
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: output/DesktopInvasion-Windows/
