name: Build Windows (MSVC)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (MSVC)
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        $outputDir = "output\DesktopInvasion-Windows"
        New-Item -ItemType Directory -Force -Path $outputDir

        $exePath = Get-ChildItem -Path build -Recurse -Filter "DesktopInvasion.exe" |
                   Where-Object { $_.FullName -match "Release" } |
                   Select-Object -First 1 -ExpandProperty FullName

        if (-not $exePath) {
          $exePath = Get-ChildItem -Path build -Recurse -Filter "DesktopInvasion.exe" |
                     Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not $exePath) {
          Write-Error "Executable not found!"
          Get-ChildItem -Path build -Recurse -Filter "*.exe"
          exit 1
        }

        Write-Host "Found exe: $exePath"
        Copy-Item $exePath "$outputDir\"

        windeployqt6 --release --compiler-runtime --no-translations --verbose 2 --qmldir "$pwd\qml" "$outputDir\DesktopInvasion.exe"

        $vcRedistDir = "${env:VCToolsRedistDir}x64\Microsoft.VC143.CRT"
        if (Test-Path $vcRedistDir) {
          Get-ChildItem "$vcRedistDir\*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$outputDir\" -Force
          }
        }

        Get-ChildItem $outputDir | Select-Object Name, Length


    - name: Smoke test
      shell: powershell
      timeout-minutes: 1
      run: |
        $exe = "output\DesktopInvasion-Windows\DesktopInvasion.exe"
        $logFile = "output\DesktopInvasion-Windows\ci_smoke.log"

        if (-not (Test-Path $exe)) {
          Write-Error "Exe not found for smoke test: $exe"
          exit 1
        }

        [System.Environment]::SetEnvironmentVariable("CI_SMOKE", "1", "Process")
        $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow

        Start-Sleep -Seconds 5

        Write-Host "--- ci_smoke.log ---"
        if (Test-Path $logFile) { Get-Content $logFile } else { Write-Host "(no log file produced)" }

        if ($proc.HasExited) {
          $code = $proc.ExitCode
          if ($code -ne 0) {
            Write-Error "App crashed on startup. Exit code: $code"
            exit 1
          } else {
            Write-Host "App exited with code 0 within 5 seconds"
          }
        } else {
          Write-Host "Smoke test passed"
          $proc.Kill()
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: output/DesktopInvasion-Windows/
