name: Build Windows (MinGW)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache MinGW
      id: mingw-cache
      uses: actions/cache@v4
      with:
        path: C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64
        key: ${{ runner.os }}-mingw-13.2.0

    - name: Setup MinGW
      if: steps.mingw-cache.outputs.cache-hit != 'true'
      run: |
        choco install mingw --version=13.2.0 --allow-downgrade -y --force
      shell: powershell

    - name: Add MinGW to PATH
      run: |
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH
      shell: powershell

    - name: Verify MinGW
      run: |
        gcc --version
        g++ --version
      shell: bash

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Configure CMake
      run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --parallel
      shell: bash

    - name: Verify windeployqt
      shell: powershell
      run: |
        $wdqt = Get-Command windeployqt.exe | Select-Object -ExpandProperty Source
        Write-Host "windeployqt path: $wdqt"

    - name: Package
      shell: powershell
      run: |
        $outputDir = "output/DesktopInvasion-Windows"
        New-Item -ItemType Directory -Force -Path $outputDir

        $exePath = "build/bin/DesktopInvasion.exe"
        if (Test-Path $exePath) {
          Copy-Item $exePath $outputDir/
        } else {
          Write-Host "Executable not found at $exePath"
          Get-ChildItem -Path build -Recurse
          exit 1
        }

        # Deploy Qt DLLs
        windeployqt.exe --release --compiler-runtime --verbose 2 --qmldir qml $outputDir/DesktopInvasion.exe

        # Copy Qt OpenGL DLLs (windeployqt misses these)
        $qtBin = (Get-Command windeployqt.exe).Source | Split-Path
        foreach ($dll in @("libEGL.dll", "libGLESv2.dll", "opengl32sw.dll", "d3dcompiler_47.dll")) {
          if (Test-Path "$qtBin\$dll") {
            Copy-Item "$qtBin\$dll" $outputDir/
            Write-Host "Copied $dll"
          } else {
            Write-Host "WARNING: $dll not found in $qtBin"
          }
        }

        # Copy MinGW runtime DLLs (windeployqt doesn't handle these)
        $mingwBin = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
        foreach ($dll in @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")) {
          if (Test-Path "$mingwBin\$dll") {
            Copy-Item "$mingwBin\$dll" $outputDir/
            Write-Host "Copied $dll"
          } else {
            Write-Host "WARNING: $dll not found in $mingwBin"
          }
        }

        # List final output for verification
        Write-Host "Final output directory contents:"
        Get-ChildItem $outputDir | Select-Object Name

        Compress-Archive -Path "$outputDir\*" -DestinationPath DesktopInvasion-Windows.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: DesktopInvasion-Windows.zip
