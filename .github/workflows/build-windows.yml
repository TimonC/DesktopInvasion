name: Build Windows (MSVC)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (MSVC)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        $outputDir = "output/DesktopInvasion-Windows"
        New-Item -ItemType Directory -Force -Path $outputDir

        $exePath = "build/bin/Release/DesktopInvasion.exe"
        if (-not (Test-Path $exePath)) {
          $exePath = "build/bin/DesktopInvasion.exe"
        }
        if (Test-Path $exePath) {
          Copy-Item $exePath $outputDir/
        } else {
          Write-Host "Executable not found, searching..."
          Get-ChildItem -Path build -Recurse -Filter "*.exe"
          exit 1
        }

        windeployqt.exe --release --verbose 2 --qmldir qml $outputDir/DesktopInvasion.exe

        $redistDir = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
        $redistVersion = Get-ChildItem $redistDir | Sort-Object Name -Descending | Select-Object -First 1
        $redistX64 = Join-Path $redistVersion.FullName "x64\Microsoft.VC143.CRT"
        Write-Host "Copying MSVC runtime DLLs from $redistX64"
        foreach ($dll in @("msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
          if (Test-Path "$redistX64\$dll") {
            Copy-Item "$redistX64\$dll" $outputDir/
            Write-Host "Copied $dll"
          } else {
            Write-Host "WARNING: $dll not found at $redistX64"
          }
        }

        Write-Host "Final output directory contents:"
        Get-ChildItem $outputDir | Select-Object Name

        Compress-Archive -Path "$outputDir\*" -DestinationPath DesktopInvasion-Windows.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: DesktopInvasion-Windows.zip
