name: Build Windows (MinGW)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MinGW
      run: |
        # Install MinGW via chocolatey
        choco install mingw --version=13.2.0 --allow-downgrade -y --force

        # Add MinGW to PATH
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $env:GITHUB_PATH

        # Create any missing directories to avoid errors
        New-Item -ItemType Directory -Force -Path "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\lib" -ErrorAction SilentlyContinue
      shell: powershell

    - name: Verify MinGW
      run: |
        gcc --version
        g++ --version
      shell: bash

    - name: Install Qt (MinGW)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Configure CMake (MinGW)
      run: |
        cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: |
        cmake --build build --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        # Create output directory
        New-Item -ItemType Directory -Force -Path output/DesktopInvasion-Windows

        # Copy executable
        Copy-Item build/DesktopInvasion.exe output/DesktopInvasion-Windows/

        # Find Qt path
        $qtPath = "${{ env.Qt6_Dir }}"
        $qtBin = $qtPath -replace 'lib\\cmake\\Qt6', 'bin'

        Write-Host "Qt path: $qtPath"
        Write-Host "Qt bin: $qtBin"

        # Run windeployqt
        & "$qtBin/windeployqt.exe" --release --qmldir qml output/DesktopInvasion-Windows/DesktopInvasion.exe

        # Find and copy MinGW runtime DLLs
        $mingwPaths = @(
          "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin",
          "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\lib",
          "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\lib"
        )

        $mingwDlls = @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")

        foreach ($dll in $mingwDlls) {
          $found = $false
          foreach ($path in $mingwPaths) {
            $dllPath = Join-Path $path $dll
            if (Test-Path $dllPath) {
              Copy-Item $dllPath output/DesktopInvasion-Windows/
              Write-Host " Copied $dll from $path"
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host " Warning: Could not find $dll"
          }
        }

        # Create README - FIXED VERSION
        $readmeContent = @"
Desktop Invasion - Windows Version

To play: Double-click DesktopInvasion.exe

Built with: Qt 6.8.0 (MinGW)
"@
        $readmeContent | Out-File -FilePath output/DesktopInvasion-Windows/README.txt -Encoding UTF8

        # Create zip
        Compress-Archive -Path output\DesktopInvasion-Windows -DestinationPath DesktopInvasion-Windows.zip -Force

        Write-Host " Package created: DesktopInvasion-Windows.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: DesktopInvasion-Windows.zip
