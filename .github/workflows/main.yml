name: Build Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (MSVC)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: bash

    - name: Package
      shell: powershell
      run: |
        # Create output directory
        New-Item -ItemType Directory -Force -Path output/DesktopInvasion-Windows

        # Copy executable
        Copy-Item build/Release/DesktopInvasion.exe output/DesktopInvasion-Windows/

        # Find Qt path
        $qtPath = "${{ env.Qt6_Dir }}"
        $qtBin = $qtPath -replace 'lib\\cmake\\Qt6', 'bin'

        # Run windeployqt
        & "$qtBin/windeployqt.exe" --release --qmldir qml output/DesktopInvasion-Windows/DesktopInvasion.exe

        # For MSVC, we need VC runtime DLLs
        $vcRedistPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\v143\x64\Microsoft.VC143.CRT"
        Copy-Item "$vcRedistPath\*.dll" output\DesktopInvasion-Windows\

        # Create README
        @"
        Desktop Invasion - Windows Version
        To play: Double-click DesktopInvasion.exe
        "@ | Out-File -FilePath output/DesktopInvasion-Windows/README.txt -Encoding UTF8

        # Create zip
        Compress-Archive -Path output\DesktopInvasion-Windows -DestinationPath DesktopInvasion-Windows.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-Windows
        path: DesktopInvasion-Windows.zip
