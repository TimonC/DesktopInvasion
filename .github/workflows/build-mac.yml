name: Build macOS
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    env:
      APP_NAME: DesktopInvasion
    steps:
    - uses: actions/checkout@v4

    - uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        host: mac
        target: desktop
        arch: clang_64
        cache: true

    - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
    - run: cmake --build build --parallel

    - name: Package
      run: |
        APP_PATH=$(find build -name "$APP_NAME.app" -type d | head -1)
        [ -z "$APP_PATH" ] && { echo "Error: .app not found"; find build -type f; exit 1; }
        echo "Found: $APP_PATH"

        macdeployqt "$APP_PATH" -qmldir=qml

        INFO_PLIST="$APP_PATH/Contents/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.github.${GITHUB_ACTOR}.$APP_NAME" "$INFO_PLIST"
        /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 11.0" "$INFO_PLIST"

        xattr -cr "$APP_PATH"
        codesign --force --deep --sign - "$APP_PATH"
        codesign --verify --verbose "$APP_PATH"

        hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$APP_NAME-macOS.dmg"
        codesign --force --sign - "$APP_NAME-macOS.dmg" 2>/dev/null || true

    - name: Smoke test
      timeout-minutes: 1
      run: |
        APP_PATH=$(find build -name "$APP_NAME.app" -type d | head -1)
        [ -z "$APP_PATH" ] && { echo "Error: .app not found"; exit 1; }

        QT_QPA_PLATFORM=offscreen "$APP_PATH/Contents/MacOS/$APP_NAME" > smoke.log 2>&1 &
        APP_PID=$!
        sleep 5

        if kill -0 $APP_PID 2>/dev/null; then
          echo "Smoke test passed"
          kill $APP_PID
          wait $APP_PID 2>/dev/null || true
        else
          wait $APP_PID; EXIT_CODE=$?
          cat smoke.log
          [ $EXIT_CODE -eq 0 ] && echo "App exited cleanly" || { echo "Crashed. Exit: $EXIT_CODE"; exit 1; }
        fi

    - name: Upload smoke log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-log-macos
        path: smoke.log

    - uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-macOS
        path: DesktopInvasion-macOS.dmg
