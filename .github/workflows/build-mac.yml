name: Build macOS
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt (macOS)
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        cache: true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      shell: bash

    - name: Build
      run: cmake --build build --parallel
      shell: bash

    - name: Package
      run: |
        APP_PATH=$(find build -name "DesktopInvasion.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: .app bundle not found"
          find build -type f
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        macdeployqt "$APP_PATH" -qmldir=qml
        hdiutil create -volname "DesktopInvasion" \
          -srcfolder "$APP_PATH" \
          -ov -format UDZO \
          DesktopInvasion-macOS.dmg

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: DesktopInvasion-macOS
        path: DesktopInvasion-macOS.dmg
